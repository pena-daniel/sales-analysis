name: dbt CI

on:
  push:
    branches:
      - main

jobs:

  setup:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dbt_user
          POSTGRES_PASSWORD: dbt_pass
          POSTGRES_DB: sales_db
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          pip install dbt-core==1.8.2 dbt-postgres==1.8.2

      - name: Create profiles.yml
        run: |
          cat > profiles.yml << EOF
          etl:
            target: dev
            outputs:
              dev:
                type: postgres
                host: postgres
                user: dbt_user
                password: dbt_pass
                port: 5432
                dbname: sales_db
                schema: analytics
                threads: 4
          EOF

      - name: Upload profile
        uses: actions/upload-artifact@v4
        with:
          name: dbt-config
          path: profiles.yml

  debug:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dbt-config

      - name: Install dbt
        run: pip install dbt-core==1.8.2 dbt-postgres==1.8.2

      - name: dbt debug
        run: dbt debug --profiles-dir .

  deps:
    needs: debug
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dbt-config

      - name: Install dbt
        run: pip install dbt-core==1.8.2 dbt-postgres==1.8.2

      - name: dbt deps
        run: dbt deps --profiles-dir .

  seed:
    needs: deps
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dbt-config

      - name: Install dbt
        run: pip install dbt-core==1.8.2 dbt-postgres==1.8.2

      - name: dbt seed
        run: dbt seed --profiles-dir .

  build:
    needs: seed
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dbt-config

      - name: Install dbt
        run: pip install dbt-core==1.8.2 dbt-postgres==1.8.2

      - name: dbt build
        run: dbt build --profiles-dir .

  tests:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dbt-config

      - name: Install dbt
        run: pip install dbt-core==1.8.2 dbt-postgres==1.8.2

      - name: dbt test
        run: dbt test --profiles-dir .