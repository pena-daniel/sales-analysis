name: dbt CI

on:
  push:
    branches: [ main ]

jobs:
  run-dbt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          pip install dbt-postgres

      - name: Run dbt debug
        run: dbt debug

      - name: Run dbt build
        run: dbt build