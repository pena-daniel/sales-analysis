jobs:
  run-dbt:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dbt_user
          POSTGRES_PASSWORD: dbt_pass
          POSTGRES_DB: sales_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dbt_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-core dbt-postgres

      - name: Create profiles.yml
        run: |
          cat > profiles.yml << EOF
          etl:
            target: dev
            outputs:
              dev:
                type: postgres
                host: postgres
                user: dbt_user
                password: dbt_pass
                port: 5432
                dbname: sales_db
                schema: analytics
                threads: 4
          EOF

      - name: dbt debug
        run: dbt debug --profiles-dir .

      - name: dbt seed
        run: dbt seed --profiles-dir .

      - name: dbt build
        run: dbt build --profiles-dir .