name: dbt CI

on:
  push:
    branches: [ main ]

jobs:
  run-dbt:
    runs-on: ubuntu-latest


    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dbt_user
          POSTGRES_PASSWORD: dbt_pass
          POSTGRES_DB: sales_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dbt_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DBT_PROFILES_DIR: ./

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt Core + Postgres adapter
        run: |
          pip install dbt-core==1.8.2 dbt-postgres==1.8.2

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U dbt_user; do
            echo "waiting for postgres..."
            sleep 2
          done

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > profiles.yml << EOF
          etl:
            target: dev
            outputs:
              dev:
                type: postgres
                host: ${{ secrets.DB_HOST }}
                user: dbt_user
                password: dbt_pass
                port: 5432
                dbname: sales_db
                schema: analytics
                threads: 4
          EOF

      - name: dbt deps
        run: dbt deps --profiles-dir .

      - name: dbt seed
        run: dbt seed --profiles-dir .

      - name: dbt debug
        run: dbt debug --profiles-dir .

      - name: dbt build
        run: dbt build --profiles-dir .

      - name: dbt test
        run: dbt test --profiles-dir .